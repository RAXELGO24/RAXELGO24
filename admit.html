<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAXEL GO 24 — Admin</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#f4f6f8;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    color:#111827;
}

.admin-card{
    width:100%;
    max-width:420px;
    background:white;
    padding:28px 22px;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(0,0,0,0.10);
    text-align:center;
}

.logo{
    width:80px;
    height:80px;
    object-fit:contain;
    background:white;
    border-radius:12px;
    padding:4px;
    margin-bottom:12px;
}

h1{
    font-size:25px;
    color:#111827;
}

.subtitle{
    color:#6b7280;
    margin-top:6px;
    font-size:14px;
}

.admin-title{
    margin-top:25px;
    font-size:21px;
}

label{
    display:block;
    text-align:left;
    font-weight:bold;
    margin:18px 0 7px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#16a34a;
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:55px;
}

.show-password{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:none;
    cursor:pointer;
    font-size:19px;
}

.login-btn{
    width:100%;
    margin-top:22px;
    padding:14px;
    border:none;
    border-radius:9px;
    background:#16a34a;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:disabled{
    opacity:.6;
}

.message{
    margin-top:15px;
    font-size:14px;
    color:#dc2626;
    min-height:20px;
}

.footer{
    margin-top:25px;
    padding-top:15px;
    border-top:1px solid #eee;
    color:#9ca3af;
    font-size:12px;
}


/* ================= DASHBOARD ================= */

.dashboard{
    display:none;
    width:100%;
    max-width:1000px;
}

.dashboard-header{
    background:#111827;
    color:white;
    padding:22px;
    border-radius:16px;
    text-align:center;
}

.dashboard-header h1{
    color:white;
}

.dashboard-card{
    background:white;
    margin-top:18px;
    padding:20px;
    border-radius:16px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.dashboard-title{
    text-align:center;
    margin-bottom:18px;
}

.refresh-btn{
    display:block;
    width:100%;
    padding:13px;
    border:none;
    border-radius:9px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:18px;
}

.refresh-btn:disabled{
    opacity:.6;
}


/* ================= BOOKINGS ================= */

.booking-list{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.booking-card{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:17px;
    background:#f9fafb;
}

.booking-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.booking-number{
    font-size:17px;
    font-weight:bold;
}

.status{
    padding:5px 9px;
    border-radius:20px;
    background:#fef3c7;
    color:#92400e;
    font-size:12px;
    font-weight:bold;
    text-transform:uppercase;
}

.booking-detail{
    background:white;
    padding:10px;
    border-radius:8px;
    margin-top:7px;
    font-size:14px;
}

.booking-detail strong{
    color:#111827;
}

.empty-message{
    text-align:center;
    padding:25px 10px;
    color:#6b7280;
    background:#f9fafb;
    border-radius:10px;
}

.error-message{
    text-align:center;
    padding:15px;
    color:#dc2626;
    background:#fef2f2;
    border-radius:10px;
    font-size:14px;
}

.logout-btn{
    display:block;
    margin:20px auto 0;
    padding:12px 22px;
    border:none;
    border-radius:8px;
    background:#dc2626;
    color:white;
    font-weight:bold;
    cursor:pointer;
}


/* ================= MOBILE ================= */

@media(max-width:600px){

    body{
        align-items:flex-start;
        padding:12px;
    }

    .dashboard{
        width:100%;
    }

    .dashboard-header{
        margin-top:5px;
    }

}

</style>
</head>

<body>


<!-- ================= LOGIN ================= -->

<div class="admin-card" id="loginPage">

    <img
        src="https://i.ibb.co/qLnzFL22/raxelgo24-logo.png"
        class="logo"
        alt="RAXEL GO 24"
    >

    <h1>
        RAXEL GO 24
    </h1>

    <p class="subtitle">
        Admin Management Panel
    </p>

    <h2 class="admin-title">
        🔐 Admin Login
    </h2>


    <label>
        Email
    </label>

    <input
        type="email"
        id="email"
        placeholder="Enter admin email"
        autocomplete="username"
    >


    <label>
        Password
    </label>

    <div class="password-box">

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            autocomplete="current-password"
        >

        <button
            type="button"
            class="show-password"
            onclick="togglePassword()"
        >
            👁️
        </button>

    </div>


    <button
        class="login-btn"
        id="loginButton"
        onclick="adminLogin()"
    >
        🔐 Login
    </button>


    <div
        class="message"
        id="loginMessage"
    ></div>


    <div class="footer">

        © 2026 RAXEL GO 24
        <br>
        Managed by Imtiyaz Khan

    </div>

</div>



<!-- ================= DASHBOARD ================= -->

<div
    class="dashboard"
    id="dashboardPage"
>

    <div class="dashboard-header">

        <h1>
            RAXEL GO 24 🛺
        </h1>

        <p style="margin-top:8px;">
            Admin Dashboard
        </p>

    </div>


    <div class="dashboard-card">

        <h2 class="dashboard-title">
            📋 Customer Bookings
        </h2>


        <button
            class="refresh-btn"
            id="refreshButton"
            onclick="loadBookings()"
        >
            🔄 Refresh Bookings
        </button>


        <div
            class="booking-list"
            id="bookingList"
        >

            <div class="empty-message">
                Loading bookings...
            </div>

        </div>


        <button
            class="logout-btn"
            onclick="adminLogout()"
        >
            🚪 Logout
        </button>

    </div>

</div>



<!-- ================= SUPABASE ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://phrlnhzbqqzeoxhpdeyt.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_cLNIvPuSPOrU6Ro6Leq9Hg_45You9FO";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* ================= PASSWORD ================= */

function togglePassword(){

    const password =
        document.getElementById("password");


    if(password.type === "password"){

        password.type = "text";

    }else{

        password.type = "password";

    }

}



/* ================= LOGIN ================= */

async function adminLogin(){

    const email =
        document.getElementById("email")
        .value
        .trim();


    const password =
        document.getElementById("password")
        .value;


    const message =
        document.getElementById("loginMessage");


    const button =
        document.getElementById("loginButton");


    message.textContent = "";


    if(!email || !password){

        message.textContent =
            "Please enter email and password.";

        return;

    }


    button.disabled = true;

    button.textContent =
        "Logging in...";


    const { data, error } =
        await supabaseClient.auth
        .signInWithPassword({

            email:email,

            password:password

        });


    if(error){

        console.error(error);

        message.textContent =
            "Login failed. Please check your email and password.";

        button.disabled = false;

        button.textContent =
            "🔐 Login";

        return;

    }


    document
        .getElementById("loginPage")
        .style.display = "none";


    document
        .getElementById("dashboardPage")
        .style.display = "block";


    button.disabled = false;

    button.textContent =
        "🔐 Login";


    loadBookings();

}



/* ================= LOAD BOOKINGS ================= */

async function loadBookings(){

    const bookingList =
        document.getElementById("bookingList");


    const refreshButton =
        document.getElementById("refreshButton");


    bookingList.innerHTML = `
        <div class="empty-message">
            Loading bookings...
        </div>
    `;


    refreshButton.disabled = true;

    refreshButton.textContent =
        "Loading...";


    const { data, error } =
        await supabaseClient
        .from("bookings")
        .select("*")
        .order("id", {
            ascending:false
        });


    refreshButton.disabled = false;

    refreshButton.textContent =
        "🔄 Refresh Bookings";


    if(error){

        console.error(error);


        bookingList.innerHTML = `
            <div class="error-message">
                Bookings load nahi ho paayi.<br><br>
                Please check Supabase permissions.
            </div>
        `;

        return;

    }


    if(!data || data.length === 0){

        bookingList.innerHTML = `
            <div class="empty-message">
                📭 Abhi koi booking nahi hai.
            </div>
        `;

        return;

    }


    bookingList.innerHTML = "";


    data.forEach((booking,index) => {

        const card =
            document.createElement("div");


        card.className =
            "booking-card";


        const status =
            booking.status || "pending";


        card.innerHTML = `

            <div class="booking-top">

                <div class="booking-number">
                    Booking #${data.length - index}
                </div>

                <div class="status">
                    ${escapeHTML(status)}
                </div>

            </div>


            <div class="booking-detail">

                <strong>Customer:</strong>

                ${escapeHTML(
                    booking.customer_name || "-"
                )}

            </div>


            <div class="booking-detail">

                <strong>Mobile:</strong>

                ${escapeHTML(
                    booking.phone || "-"
                )}

            </div>


            <div class="booking-detail">

                <strong>From:</strong>

                ${escapeHTML(
                    booking.pickup || "Ranisagar"
                )}

            </div>


            <div class="booking-detail">

                <strong>To:</strong>

                ${escapeHTML(
                    booking.destination || "-"
                )}

            </div>


            <div class="booking-detail">

                <strong>Date:</strong>

                ${escapeHTML(
                    booking.booking_date || "-"
                )}

            </div>


            <div class="booking-detail">

                <strong>Time:</strong>

                ${escapeHTML(
                    booking.booking_time || "-"
                )}

            </div>

        `;


        bookingList.appendChild(card);

    });

}



/* ================= HTML SAFETY ================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}



/* ================= LOGOUT ================= */

async function adminLogout(){

    await supabaseClient.auth.signOut();


    document
        .getElementById("dashboardPage")
        .style.display = "none";


    document
        .getElementById("loginPage")
        .style.display = "block";


    document
        .getElementById("email")
        .value = "";


    document
        .getElementById("password")
        .value = "";


    document
        .getElementById("loginMessage")
        .textContent = "";

}



/* ================= EXISTING SESSION ================= */

async function checkSession(){

    const { data } =
        await supabaseClient.auth.getSession();


    if(data.session){

        document
            .getElementById("loginPage")
            .style.display = "none";


        document
            .getElementById("dashboardPage")
            .style.display = "block";


        loadBookings();

    }

}


checkSession();

</script>

</body>
</html>
