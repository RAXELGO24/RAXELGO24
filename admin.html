<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAXEL GO 24 - Admin</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f8;
    color:#111827;
    min-height:100vh;
}

/* ================= LOGIN ================= */

.login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-card{
    width:100%;
    max-width:420px;
    background:#fff;
    padding:30px 22px;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.10);
    text-align:center;
}

.logo{
    width:82px;
    height:82px;
    object-fit:contain;
    background:#fff;
    border-radius:12px;
    padding:4px;
    margin-bottom:12px;
}

.login-card h1{
    font-size:26px;
}

.subtitle{
    color:#6b7280;
    margin-top:6px;
    font-size:14px;
}

.login-title{
    margin-top:25px;
    font-size:21px;
}

label{
    display:block;
    text-align:left;
    font-weight:bold;
    margin:18px 0 7px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    outline:none;
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:55px;
}

.show-password{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    font-size:19px;
    cursor:pointer;
}

.login-btn{
    width:100%;
    margin-top:22px;
    padding:14px;
    border:0;
    border-radius:9px;
    background:#16a34a;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:disabled{
    opacity:.6;
}

.message{
    min-height:20px;
    margin-top:14px;
    color:#dc2626;
    font-size:14px;
}

.footer{
    margin-top:25px;
    padding-top:15px;
    border-top:1px solid #eee;
    color:#9ca3af;
    font-size:12px;
}


/* ================= DASHBOARD ================= */

.dashboard{
    display:none;
    min-height:100vh;
}

.topbar{
    background:#111827;
    color:white;
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.topbar h1{
    font-size:22px;
}

.topbar p{
    color:#d1d5db;
    font-size:12px;
    margin-top:4px;
}

.logout{
    border:0;
    background:#dc2626;
    color:white;
    padding:10px 14px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.container{
    width:100%;
    max-width:1150px;
    margin:auto;
    padding:20px;
}

.welcome{
    background:white;
    padding:22px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.welcome h2{
    font-size:22px;
}

.welcome p{
    margin-top:7px;
    color:#6b7280;
}


/* ================= STATS ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-top:18px;
}

.stat{
    background:white;
    border-radius:14px;
    padding:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.stat small{
    color:#6b7280;
}

.stat strong{
    display:block;
    margin-top:8px;
    font-size:28px;
}


/* ================= BOOKINGS ================= */

.booking-section{
    background:white;
    margin-top:20px;
    border-radius:15px;
    padding:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.booking-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:15px;
}

.booking-header h2{
    font-size:20px;
}

.refresh-btn{
    border:0;
    background:#111827;
    color:white;
    padding:10px 14px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.loading{
    text-align:center;
    padding:25px;
    color:#6b7280;
}

.empty{
    text-align:center;
    padding:25px;
    background:#f8fafc;
    border-radius:10px;
    color:#6b7280;
}


/* ================= BOOKING CARD ================= */

.booking-card{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:17px;
    margin-top:12px;
    background:#fff;
}

.booking-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.booking-id{
    font-weight:bold;
    font-size:15px;
}

.status{
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    background:#f3f4f6;
    text-transform:capitalize;
}

.booking-info{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.info{
    background:#f8fafc;
    padding:10px;
    border-radius:8px;
    font-size:14px;
}

.info strong{
    display:block;
    margin-bottom:3px;
    color:#374151;
}

.destination{
    grid-column:1 / -1;
}


/* ================= ACTION BUTTONS ================= */

.booking-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:14px;
}

.action-btn{
    flex:1;
    min-width:110px;
    padding:11px 12px;
    border:0;
    border-radius:8px;
    color:white;
    font-weight:bold;
    font-size:13px;
    cursor:pointer;
}

.action-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.accept-btn{
    background:#16a34a;
}

.reject-btn{
    background:#dc2626;
}

.cancel-btn{
    background:#f59e0b;
}

.complete-btn{
    background:#2563eb;
}


/* ================= MOBILE ================= */

@media(max-width:700px){

    .container{
        padding:14px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .stat{
        padding:16px;
    }

    .stat strong{
        font-size:24px;
    }

    .booking-info{
        grid-template-columns:1fr;
    }

    .destination{
        grid-column:auto;
    }

    .booking-header{
        align-items:flex-start;
    }

}

@media(max-width:450px){

    .topbar{
        padding:15px;
    }

    .topbar h1{
        font-size:18px;
    }

    .logout{
        padding:8px 10px;
        font-size:12px;
    }

    .booking-actions{
        flex-direction:column;
    }

    .action-btn{
        width:100%;
    }

}

</style>
</head>

<body>


<!-- ================= LOGIN ================= -->

<div class="login-screen" id="loginScreen">

    <div class="login-card">

        <img
            src="https://i.ibb.co/qLnzFL22/raxelgo24-logo.png"
            class="logo"
            alt="RAXEL GO 24"
        >

        <h1>RAXEL GO 24</h1>

        <p class="subtitle">
            Admin Management Panel
        </p>

        <h2 class="login-title">
            🔐 Admin Login
        </h2>

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter admin email"
            autocomplete="username"
        >

        <label>Password</label>

        <div class="password-box">

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
            >

            <button
                type="button"
                class="show-password"
                onclick="togglePassword()"
            >
                👁️
            </button>

        </div>

        <button
            class="login-btn"
            id="loginButton"
            onclick="login()"
        >
            🔐 Login
        </button>

        <div
            class="message"
            id="message"
        ></div>

        <div class="footer">
            © 2026 RAXEL GO 24
            <br>
            Managed by Imtiyaz Khan
        </div>

    </div>

</div>


<!-- ================= DASHBOARD ================= -->

<div
    class="dashboard"
    id="dashboard"
>

    <div class="topbar">

        <div>
            <h1>RAXEL GO 24 🛺</h1>
            <p>Admin Management Panel</p>
        </div>

        <button
            class="logout"
            onclick="logout()"
        >
            🚪 Logout
        </button>

    </div>


    <main class="container">

        <section class="welcome">

            <h2>
                👋 Welcome, Admin
            </h2>

            <p>
                Live booking management
            </p>

        </section>


        <!-- ================= STATS ================= -->

        <section class="stats">

            <div class="stat">
                <small>Total Bookings</small>
                <strong id="totalBookings">0</strong>
            </div>

            <div class="stat">
                <small>Pending</small>
                <strong id="pendingBookings">0</strong>
            </div>

            <div class="stat">
                <small>Accepted</small>
                <strong id="acceptedBookings">0</strong>
            </div>

            <div class="stat">
                <small>Rejected</small>
                <strong id="rejectedBookings">0</strong>
            </div>

            <div class="stat">
                <small>Cancelled</small>
                <strong id="cancelledBookings">0</strong>
            </div>

            <div class="stat">
                <small>Completed</small>
                <strong id="completedBookings">0</strong>
            </div>

        </section>


        <!-- ================= BOOKINGS ================= -->

        <section class="booking-section">

            <div class="booking-header">

                <h2>
                    📋 Live Bookings
                </h2>

                <button
                    class="refresh-btn"
                    onclick="loadBookings()"
                >
                    🔄 Refresh
                </button>

            </div>

            <div id="bookingList">

                <div class="loading">
                    Loading bookings...
                </div>

            </div>

        </section>

    </main>

</div>


<!-- ================= SUPABASE ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://phrlnhzbqqzeoxhpdeyt.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_cLNIvPuSPOrU6Ro6Leq9Hg_45You9FO";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ================= PASSWORD ================= */

function togglePassword(){

    const input =
        document.getElementById("password");

    input.type =
        input.type === "password"
        ? "text"
        : "password";

}


/* ================= LOGIN ================= */

async function login(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("loginButton");


    message.textContent = "";


    if(!email || !password){

        message.textContent =
            "Please enter email and password.";

        return;

    }


    button.disabled = true;

    button.textContent =
        "Logging in...";


    const { error } =
        await supabaseClient.auth.signInWithPassword({

            email:email,
            password:password

        });


    if(error){

        console.error(error);

        message.textContent =
            "Login failed. Please check your email and password.";

        button.disabled = false;

        button.textContent =
            "🔐 Login";

        return;

    }


    showDashboard();

    button.disabled = false;

    button.textContent =
        "🔐 Login";

}


/* ================= SHOW DASHBOARD ================= */

function showDashboard(){

    document
        .getElementById("loginScreen")
        .style.display = "none";

    document
        .getElementById("dashboard")
        .style.display = "block";

    loadBookings();

}


/* ================= LOAD BOOKINGS ================= */

async function loadBookings(){

    const list =
        document.getElementById("bookingList");

    list.innerHTML =
        '<div class="loading">Loading bookings...</div>';


    const { data, error } =
        await supabaseClient
        .from("bookings")
        .select(
            "id, customer_name, phone, pickup, destination, booking_date, booking_time, status"
        )
        .order(
            "id",
            { ascending:false }
        );


    if(error){

        console.error(error);

        list.innerHTML =
            '<div class="empty">Unable to load bookings. Please check Supabase permissions.</div>';

        return;

    }


    updateStats(data || []);

    renderBookings(data || []);

}


/* ================= STATS ================= */

function updateStats(bookings){

    document.getElementById("totalBookings").textContent =
        bookings.length;

    document.getElementById("pendingBookings").textContent =
        bookings.filter(
            b => String(b.status).toLowerCase() === "pending"
        ).length;

    document.getElementById("acceptedBookings").textContent =
        bookings.filter(
            b => String(b.status).toLowerCase() === "accepted"
        ).length;

    document.getElementById("rejectedBookings").textContent =
        bookings.filter(
            b => String(b.status).toLowerCase() === "rejected"
        ).length;

    document.getElementById("cancelledBookings").textContent =
        bookings.filter(
            b => String(b.status).toLowerCase() === "cancelled"
        ).length;

    document.getElementById("completedBookings").textContent =
        bookings.filter(
            b => String(b.status).toLowerCase() === "completed"
        ).length;

}


/* ================= RENDER BOOKINGS ================= */

function renderBookings(bookings){

    const list =
        document.getElementById("bookingList");


    if(!bookings.length){

        list.innerHTML =
            '<div class="empty">No bookings found.</div>';

        return;

    }


    list.innerHTML =
        bookings.map(
            booking => {

                const status =
                    String(
                        booking.status || "pending"
                    ).toLowerCase();


                let actions = "";


                /* PENDING */

                if(status === "pending"){

                    actions = `

                        <div class="booking-actions">

                            <button
                                class="action-btn accept-btn"
                                onclick="updateBookingStatus('${escapeHtml(booking.id)}','accepted')"
                            >
                                ✅ Accept
                            </button>

                            <button
                                class="action-btn reject-btn"
                                onclick="updateBookingStatus('${escapeHtml(booking.id)}','rejected')"
                            >
                                ❌ Reject
                            </button>

                        </div>

                    `;

                }


                /* ACCEPTED */

                else if(status === "accepted"){

                    actions = `

                        <div class="booking-actions">

                            <button
                                class="action-btn cancel-btn"
                                onclick="updateBookingStatus('${escapeHtml(booking.id)}','cancelled')"
                            >
                                🚫 Cancel
                            </button>

                            <button
                                class="action-btn complete-btn"
                                onclick="updateBookingStatus('${escapeHtml(booking.id)}','completed')"
                            >
                                🏁 Complete
                            </button>

                        </div>

                    `;

                }


                return `

                <div class="booking-card">

                    <div class="booking-top">

                        <div class="booking-id">
                            🆔 Booking #${escapeHtml(booking.id)}
                        </div>

                        <div class="status">
                            ${escapeHtml(status)}
                        </div>

                    </div>


                    <div class="booking-info">

                        <div class="info">

                            <strong>
                                Customer
                            </strong>

                            ${escapeHtml(
                                booking.customer_name || "-"
                            )}

                        </div>


                        <div class="info">

                            <strong>
                                Mobile
                            </strong>

                            ${escapeHtml(
                                booking.phone || "-"
                            )}

                        </div>


                        <div class="info">

                            <strong>
                                Date
                            </strong>

                            ${escapeHtml(
                                booking.booking_date || "-"
                            )}

                        </div>


                        <div class="info">

                            <strong>
                                Time
                            </strong>

                            ${escapeHtml(
                                booking.booking_time || "-"
                            )}

                        </div>


                        <div class="info destination">

                            <strong>
                                Route
                            </strong>

                            📍 ${escapeHtml(
                                booking.pickup || "Ranisagar"
                            )}

                            →

                            ${escapeHtml(
                                booking.destination || "-"
                            )}

                        </div>

                    </div>


                    ${actions}

                </div>

                `;

            }

        ).join("");

}


/* ================= UPDATE STATUS ================= */

async function updateBookingStatus(
    bookingId,
    newStatus
){

    const buttons =
        document.querySelectorAll(
            ".action-btn"
        );


    buttons.forEach(
        button => {
            button.disabled = true;
        }
    );


    const { error } =
        await supabaseClient
        .from("bookings")
        .update({

            status:newStatus

        })
        .eq(
            "id",
            bookingId
        );


    if(error){

        console.error(error);

        alert(
            "Unable to update booking status. Please check Supabase permissions."
        );

        buttons.forEach(
            button => {
                button.disabled = false;
            }
        );

        return;

    }


    await loadBookings();

}


/* ================= SAFE HTML ================= */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ================= LOGOUT ================= */

async function logout(){

    await supabaseClient.auth.signOut();

    document
        .getElementById("dashboard")
        .style.display = "none";

    document
        .getElementById("loginScreen")
        .style.display = "flex";

    document
        .getElementById("email")
        .value = "";

    document
        .getElementById("password")
        .value = "";

}


/* ================= EXISTING SESSION ================= */

async function checkSession(){

    const { data } =
        await supabaseClient.auth.getSession();

    if(data.session){

        showDashboard();

    }

}


checkSession();

</script>

</body>
</html>
