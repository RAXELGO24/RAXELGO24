<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAXEL GO 24</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#ffffff;
    color:#111111;
}

/* ================= HEADER ================= */

.header{
    background:#005b3f;
    min-height:110px;
    padding:16px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.header-left{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo{
    width:72px;
    height:72px;
    border-radius:50%;
    object-fit:cover;
    background:#ffffff;
    border:3px solid #facc15;
}

.manager{
    color:#ffffff;
    font-size:18px;
    line-height:1.4;
}

.manager strong{
    color:#facc15;
    font-size:20px;
}

/* ================= MENU ================= */

.menu{
    width:48px;
    height:48px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:7px;
}

.menu span{
    width:40px;
    height:4px;
    background:#facc15;
    border-radius:10px;
}

/* ================= HERO ================= */

.hero{
    width:100%;
    background:#005b3f;
}

.hero-image{
    width:100%;
    height:auto;
    display:block;
}

/* ================= LOCATION ================= */

.location{
    position:relative;
    margin:-42px auto 0;
    width:86%;
    max-width:600px;
    background:#063e38;
    border:2px solid #facc15;
    border-radius:50px;
    padding:15px 18px;
    color:#ffffff;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    z-index:5;
    box-shadow:0 5px 15px rgba(0,0,0,0.25);
}

.location .pin{
    color:#facc15;
    font-size:27px;
    margin-right:5px;
}

.location strong{
    color:#facc15;
}

/* ================= INTRO ================= */

.intro{
    background:#ffffff;
    text-align:center;
    padding:75px 18px 55px;
}

.intro-small{
    font-size:18px;
    margin-bottom:22px;
}

.green-line{
    display:inline-block;
    width:45px;
    height:5px;
    background:#16a34a;
    border-radius:10px;
    margin-left:8px;
    vertical-align:middle;
}

.intro h1{
    font-size:42px;
    font-weight:800;
    line-height:1.25;
    margin-bottom:25px;
}

.heart{
    color:#facc15;
}

.intro p{
    font-size:21px;
    line-height:1.7;
}

/* ================= SUPPORT ================= */

.support{
    background:#003f32;
    padding:0 0 35px;
}

.support-image{
    width:100%;
    height:auto;
    display:block;
}

.support-button-box{
    text-align:center;
    padding:20px;
}

.support-button{
    display:inline-block;
    background:#3030d9;
    color:#ffffff;
    text-decoration:none;
    padding:14px 30px;
    border-radius:9px;
    font-size:18px;
    font-weight:bold;
}

/* ================= FOOTER ================= */

.footer{
    background:#003f32;
    color:#ffffff;
    text-align:center;
    padding:25px 15px;
}

.footer .trust{
    color:#facc15;
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

.footer .safe{
    font-size:16px;
    margin-bottom:22px;
}

.footer-line{
    width:90%;
    height:1px;
    background:rgba(255,255,255,0.25);
    margin:0 auto 20px;
}

.footer p{
    font-size:15px;
    line-height:1.7;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .header{
        min-height:105px;
        padding:14px;
    }

    .logo{
        width:65px;
        height:65px;
    }

    .manager{
        font-size:16px;
    }

    .manager strong{
        font-size:18px;
    }

    .menu span{
        width:38px;
    }

    .location{
        width:88%;
        font-size:16px;
        padding:13px 10px;
    }

    .intro{
        padding:65px 15px 45px;
    }

    .intro-small{
        font-size:16px;
    }

    .intro h1{
        font-size:36px;
    }

    .intro p{
        font-size:19px;
    }

}

</style>
</head>


<body>


<!-- ================= TOP HEADER ================= -->

<header class="header">

    <div class="header-left">

        <img
            src="logo.png"
            alt="RAXEL GO 24 Logo"
            class="logo"
        >

        <div class="manager">

            Managed by<br>

            <strong>Imtiyaz Khan</strong>

        </div>

    </div>


    <!-- MENU -->

    <div class="menu">

        <span></span>
        <span></span>
        <span></span>

    </div>

</header>



<!-- ================= MAIN HERO IMAGE ================= -->

<section class="hero">

    <img
        src="hero.png"
        alt="RAXEL GO 24 Reliable Auto Service"
        class="hero-image"
    >

</section>



<!-- ================= PICKUP LOCATION ================= -->

<div class="location">

    <span class="pin">📍</span>

    Pickup Location:

    <strong>Ranisagar</strong>

</div>



<!-- ================= INTRO SECTION ================= -->

<section class="intro">

    <div class="intro-small">

        Your Ride, Just One Tap Away

        <span class="green-line"></span>

    </div>


    <h1>

        हम हैं आपके साथ

        <span class="heart">💛</span>

    </h1>


    <p>

        जहाँ चाहें, जब चाहें — हम हैं आपके साथ।

    </p>

</section>



<!-- ================= SUPPORT SECTION ================= -->

<section class="support">

    <img
        src="support.png"
        alt="RAXEL GO 24 Help Support"
        class="support-image"
    >


    <div class="support-button-box">

        <a
            href="tel:+918294741267"
            class="support-button"
        >

            📞 Help / Support

        </a>

    </div>

</section>



<!-- ================= FOOTER ================= -->

<footer class="footer">

    <div class="trust">

        🛡️ आपका भरोसा, हमारी जिम्मेदारी

    </div>


    <div class="safe">

        Safe • Reliable • On Time

    </div>


    <div class="footer-line"></div>


    <p>
        © 2026 RAXEL GO 24
    </p>


    <p>
        Managed by Imtiyaz Khan
    </p>

</footer>


</body>
</html>
